name: Upstream Check & Automated Release

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and update upstream icon sets
        id: update_step
        run: |
          pnpm run update

          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Detected updates from upstream repositories."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "All icon sets are already up to date."
          fi

      - name: Verify build and test suite
        if: steps.update_step.outputs.has_changes == 'true'
        run: |
          pnpm typecheck
          pnpm compile
          pnpm test
          pnpm validate

      - name: Commit, Tag, and Push
        if: steps.update_step.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          RELEASE_TAG="v$(date +'%Y.%m.%d-%H%M')"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

          git add -A
          git commit -m "chore(release): update icon sets from upstream (${RELEASE_TAG}) [skip ci]"
          git tag -a "${RELEASE_TAG}" -m "Automated upstream release ${RELEASE_TAG}"
          git push origin main --tags

      - name: Create GitHub Release
        if: steps.update_step.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "Iconify Sets Release ${RELEASE_TAG}" \
            --generate-notes \
            --notes "Automated upstream synchronization release containing updated icon sets."
